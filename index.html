<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS • Medical Neural AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Inter:wght@300;400;500&display=swap');

        :root {
            --neon: #00f5ff;
            --pink: #ff00aa;
            --dark: #0a0e1a;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--dark);
            color: var(--neon);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .scanline {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(transparent, rgba(0, 245, 255, 0.03), transparent);
            background-size: 100% 4px;
            animation: scan 4s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 2;
            max-width: 1000px;
            margin: 40px auto;
            background: rgba(10, 15, 40, 0.92);
            border: 2px solid var(--neon);
            border-radius: 24px;
            box-shadow: 0 0 80px rgba(0, 245, 255, 0.5);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(90deg, var(--neon), var(--pink));
            padding: 25px;
            text-align: center;
            color: black;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.2rem;
            letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(0,0,0,0.6);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            margin-top: 8px;
        }

        .chat-box {
            height: 520px;
            padding: 30px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 80%;
            padding: 16px 22px;
            border-radius: 20px;
            animation: messagePop 0.4s ease;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, #00f5ff, #0088aa);
            color: black;
            border-bottom-right-radius: 6px;
        }

        .bot {
            align-self: flex-start;
            background: rgba(255, 0, 170, 0.15);
            border: 1px solid var(--pink);
            border-bottom-left-radius: 6px;
        }

        .input-area {
            padding: 25px;
            background: rgba(10, 15, 40, 0.98);
            border-top: 2px solid var(--neon);
            display: flex;
            gap: 15px;
        }

        input {
            flex: 1;
            padding: 18px 24px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid var(--neon);
            border-radius: 50px;
            color: white;
            font-size: 1.1rem;
        }

        button {
            padding: 0 40px;
            background: linear-gradient(90deg, var(--pink), var(--neon));
            border: none;
            border-radius: 50px;
            color: black;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            transform: scale(1.08);
            box-shadow: 0 0 40px var(--pink);
        }

        @keyframes messagePop {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes scan {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100%); }
        }
    </style>
</head>
<body>
    <div class="scanline"></div>

    <div class="container">
        <div class="header">
            <h1>NEXUS</h1>
            <p>NEURAL MEDICAL INTELLIGENCE SYSTEM v2.4</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message bot">
                <strong>NEURAL LINK ESTABLISHED.</strong><br><br>
                I am <strong>NEXUS</strong>, your medical AI assistant.<br>
                Describe your symptoms or ask any health-related question.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Describe your symptoms..." autocomplete="off">
            <button onclick="sendMessage()">TRANSMIT</button>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        function addMessage(text, isUser) {
            const msg = document.createElement('div');
            msg.className = `message ${isUser ? 'user' : 'bot'}`;
            msg.innerHTML = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, true);
            userInput.value = "";

            const loading = document.createElement('div');
            loading.className = 'message bot';
            loading.textContent = 'Analyzing neural signature...';
            chatBox.appendChild(loading);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });

                const data = await res.json();
                loading.remove();
                addMessage(data.response || "I apologize. I couldn't process that request.", false);
            } catch (err) {
                loading.remove();
                addMessage("Neural connection lost. Please try again.", false);
            }
        }

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
